app = "splice"
primary_region = "iad"

[build]
  docker = "backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1

[[mounts]]
  source = "splice_data"
  destination = "/app/uploads"
